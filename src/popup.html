<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevDocTrad</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="wrap">
  <header class="row head">
    <span class="logo" aria-hidden="true"></span>
    <div class="grow">
      <h1>DevDocTrad</h1>
      <div class="muted" id="host"></div>
    </div>
    <a href="#" id="openOptions" class="iconbtn" data-i18n-title="popupSettings" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-.98l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.6-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.6.22l-2 3.46a.49.49 0 0 0 .12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.65.07.97l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.12.22.38.3.6.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.04.24.25.42.49.42h4c.24 0 .45-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1c.22.08.48 0 .6-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.65Z"/></svg>
    </a>
  </header>

  <section class="glass card" id="unsupported" hidden>
    <p data-i18n="popupUnsupported"></p>
  </section>

  <section class="glass card stack" id="main">
    <button class="btn primary wide" id="translate" data-i18n="popupTranslate"></button>
    <div class="row two">
      <button class="btn grow" id="toggle" data-i18n="btnOriginal"></button>
      <button class="btn grow" id="stop" data-i18n="btnStop"></button>
    </div>
    <div class="muted" id="status" aria-live="polite"></div>
  </section>

  <section class="glass card stack" id="opts">
    <label class="field">
      <span data-i18n="popupKey"></span>
      <select id="keySel"></select>
    </label>
    <label class="switch">
      <input type="checkbox" id="autoSite">
      <span class="track"></span>
      <span data-i18n="popupAuto"></span>
    </label>
    <div class="muted" id="sensitiveNote" hidden data-i18n="popupSensitive"></div>
  </section>

  <section class="glass card">
    <h3 data-i18n="popupKeys"></h3>
    <ul id="keys" class="keys"></ul>
    <div class="muted" id="noKeys" hidden>
      <span data-i18n="popupNoKeys"></span>
      <a href="#" id="addKey" data-i18n="popupAddKey"></a>
    </div>
  </section>

  <footer class="muted foot" id="shortcut"></footer>
</main>
<script src="shared.js"></script>
<script src="popup.js"></script>
</body>
</html>
