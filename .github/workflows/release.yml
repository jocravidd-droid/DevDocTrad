# Publie une version GitHub (avec les deux zips) quand une étiquette v1.2.3 est envoyée,
# ou à la main (onglet Actions > Version > Run workflow) : l'étiquette v<version du manifeste>
# est alors créée par GitHub sur le commit lancé.
# Deux jobs : la construction tourne en lecture seule (aucun jeton d'écriture pendant npm ci,
# les tests et build.py) ; seule la publication reçoit contents: write, sans exécuter le code du dépôt.
name: Version

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: python3 build.py
      - name: Étiquette (celle envoyée, ou v<version> si lancé à la main) et vérification
        id: tag
        run: |
          V=$(python3 -c "import json;print(json.load(open('manifests/base.json'))['version'])")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then T="$GITHUB_REF_NAME"; else T="v$V"; fi
          test "v$V" = "$T"
          echo "tag=$T" >> "$GITHUB_OUTPUT"
      - name: Notes de version (section du CHANGELOG)
        run: |
          V=$(python3 -c "import json;print(json.load(open('manifests/base.json'))['version'])")
          awk -v v="$V" '$0 ~ "^## \\["v"\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > release/notes.md
          # pas de version publiée sans notes : section absente ou vide dans CHANGELOG.md = échec
          test -s release/notes.md || { echo "Notes de version vides : ajoute la section [$V] dans CHANGELOG.md"; exit 1; }
          grep -q '[^[:space:]]' release/notes.md || { echo "Notes de version vides : la section [$V] de CHANGELOG.md n'a aucun texte"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: version
          path: |
            release/*.zip
            release/SHA256SUMS.txt
            release/notes.md
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: version
          path: release
      - name: Créer la version GitHub (ou remplacer ses fichiers si elle existe déjà)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" release/*.zip release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "DevDocTrad $TAG" --notes-file release/notes.md \
            || gh release upload "$TAG" release/*.zip release/SHA256SUMS.txt --clobber
