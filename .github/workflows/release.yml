# Publie une version GitHub (avec les deux zips) quand une étiquette v1.2.3 est envoyée.
# Deux jobs : la construction tourne en lecture seule (aucun jeton d'écriture pendant npm ci,
# les tests et build.py) ; seule la publication reçoit contents: write, sans exécuter le code du dépôt.
name: Version

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: python3 build.py
      - name: Vérifier que l'étiquette correspond à la version
        run: |
          V=$(python3 -c "import json;print(json.load(open('manifests/base.json'))['version'])")
          test "v$V" = "$GITHUB_REF_NAME"
      - name: Notes de version (section du CHANGELOG)
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '$0 ~ "^## \\["v"\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > release/notes.md
          # pas de version publiée sans notes : section absente ou vide dans CHANGELOG.md = échec
          test -s release/notes.md || { echo "Notes de version vides : ajoute la section [$V] dans CHANGELOG.md"; exit 1; }
          grep -q '[^[:space:]]' release/notes.md || { echo "Notes de version vides : la section [$V] de CHANGELOG.md n'a aucun texte"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: version
          path: |
            release/*.zip
            release/SHA256SUMS.txt
            release/notes.md
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: version
          path: release
      - name: Créer la version GitHub (ou remplacer ses fichiers si elle existe déjà)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --title "DevDocTrad $GITHUB_REF_NAME" --notes-file release/notes.md \
            || gh release upload "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --clobber
